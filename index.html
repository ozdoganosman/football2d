<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>football2d — FM Tarzı 2D Maç Simülatörü</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="scoreboard">
        <div id="homePlate" class="plate home">EV SAHİBİ</div>
        <div class="led">
          <span id="score">0 - 0</span>
          <span id="clock">00:00</span>
        </div>
        <div id="awayPlate" class="plate away">DEPLASMAN</div>
      </header>

      <div id="stage">
        <div id="pitchWrap">
          <canvas id="pitch"></canvas>
          <div id="ticker"><span id="tickerText">Maça hoş geldiniz</span></div>
        </div>
        <aside id="side">
          <h3>Maç İstatistikleri</h3>
          <table id="stats"></table>
          <h3>Önemli Olaylar</h3>
          <ul id="feed"></ul>
        </aside>
      </div>

      <div id="controls">
        <button id="btnNew" class="btn primary">Yeni Maç</button>
        <button id="btnPlay" class="btn">Başlat</button>
        <span class="group" id="speedGroup">
          <button class="btn speed active" data-speed="1">1x</button>
          <button class="btn speed" data-speed="2">2x</button>
          <button class="btn speed" data-speed="4">4x</button>
          <button class="btn speed" data-speed="8">8x</button>
        </span>
        <select id="modeSel" class="sel">
          <option value="highlights">Önemli Anlar</option>
          <option value="full">Tüm Maç</option>
        </select>
        <button id="btnAnalysis" class="btn">Analiz</button>
        <span class="group">
          <label>Ev:</label>
          <select id="homeFormation" class="sel"></select>
          <select id="homeMentality" class="sel">
            <option value="0">Dengeli</option>
            <option value="-1">Defansif</option>
            <option value="1">Hücumcu</option>
          </select>
          <select id="homePress" class="sel">
            <option value="0">Orta pres</option>
            <option value="-1">Alçak blok</option>
            <option value="1">Yüksek pres</option>
          </select>
          <select id="homeWidth" class="sel">
            <option value="0">Normal en</option>
            <option value="-1">Dar</option>
            <option value="1">Geniş</option>
          </select>
        </span>
        <span class="group">
          <label>Dep:</label>
          <select id="awayFormation" class="sel"></select>
          <select id="awayMentality" class="sel">
            <option value="0">Dengeli</option>
            <option value="-1">Defansif</option>
            <option value="1">Hücumcu</option>
          </select>
          <select id="awayPress" class="sel">
            <option value="0">Orta pres</option>
            <option value="-1">Alçak blok</option>
            <option value="1">Yüksek pres</option>
          </select>
          <select id="awayWidth" class="sel">
            <option value="0">Normal en</option>
            <option value="-1">Dar</option>
            <option value="1">Geniş</option>
          </select>
        </span>
        <span id="seedInfo" class="muted"></span>
      </div>
    </div>

    <div id="analysisOverlay" class="hidden">
      <div id="analysisPanel">
        <div id="analysisBar">
          <strong>Maç Analizi</strong>
          <span class="group">
            <button class="btn av active" data-view="heat">Isı Haritası</button>
            <button class="btn av" data-view="passes">Pas Ağı</button>
          </span>
          <span class="group">
            <button class="btn at active" data-team="0">Ev</button>
            <button class="btn at" data-team="1">Dep</button>
          </span>
          <span id="analysisLegend" class="muted"></span>
          <button id="btnAnalysisClose" class="btn primary">Kapat</button>
        </div>
        <canvas id="analysisCanvas"></canvas>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
